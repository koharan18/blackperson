name: Windows PostgreSQL runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Elevated Windows start, query, reuse, stop and persisted restart
        shell: powershell
        run: node tests/pg-control.windows.mjs
